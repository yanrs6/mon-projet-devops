name: CI - Tests et Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -v

      - name: Construire l'image Docker
        run: docker build -t mon-projet-devops:ci .

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image Docker
        run: |
          docker tag mon-projet-devops:ci ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-devops:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-devops:latest

      - name: Demarrer le conteneur
        run: docker run -d --name mon-app-test -p 5000:5000 mon-projet-devops:ci

      - name: Verifier la route health
        run: |
          python -c "import time, urllib.request; url='http://127.0.0.1:5000/health'; exec('for i in range(15):\n try:\n  r=urllib.request.urlopen(url, timeout=2)\n  assert r.status == 200\n  assert b\"ok\" in r.read()\n  print(\"Test Docker reussi\")\n  break\n except Exception:\n  if i == 14: raise\n  time.sleep(2)')"

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f mon-app-test
